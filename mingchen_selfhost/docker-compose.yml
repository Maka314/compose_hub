name: mingchen-selfhost

services:
  portfolio:
    image: maka314/portfolio:latest
    restart: unless-stopped

  node-red:
    image: nodered/node-red:latest
    environment:
      - NODE_RED_ENABLE_PROJECTS=true # 开启项目功能（可选）
    # ports:
    #   - "1880:1880"                 # 外部访问端口
    volumes:
      - node-red-data:/data       # 将数据持久化到本地文件夹（安装的插件和流都会保存在这）
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - portfolio

volumes:
  node-red-data: