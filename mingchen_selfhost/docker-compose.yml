name: mingchen-selfhost

services:
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - tunnel-shared

  wordpress-db:
    image: mysql:5.7
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DATABASE_PASSWORD}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    networks:
      - wordpress-backend

  wordpress:
    image: wordpress:latest
    # ports:
    #   - 80
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    depends_on:
      - wordpress-db
    networks:
      - tunnel-shared
      - wordpress-backend

  firefly:
    image: fireflyiii/core:latest
    hostname: firefly
    container_name: firefly_iii_core
    restart: always
    volumes:
      - firefly_iii_upload:/var/www/html/storage/upload
    expose:
      - "8080"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      SITE_OWNER: ${SITE_OWNER:-mail@example.com}
      APP_KEY: ${APP_KEY}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en_US}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-equal}
      TZ: ${TZ:-UTC}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-notice}
      AUDIT_LOG_LEVEL: ${AUDIT_LOG_LEVEL:-emergency}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-firefly-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-firefly}
      DB_USERNAME: ${DB_USERNAME:-firefly}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      STATIC_CRON_TOKEN: ${STATIC_CRON_TOKEN}
      APP_URL: ${APP_URL:-http://localhost}
    networks:
      - tunnel-shared
      - firefly-backend
    depends_on:
      - firefly-db

  firefly-db:
    image: mariadb:lts
    hostname: firefly-db
    container_name: firefly_iii_db
    restart: always
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: ${MYSQL_RANDOM_ROOT_PASSWORD:-yes}
      MYSQL_USER: ${MYSQL_USER:-firefly}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-firefly}
    networks:
      - firefly-backend
    volumes:
      - firefly_iii_db:/var/lib/mysql

  firefly-cron:
    image: alpine
    restart: always
    container_name: firefly_iii_cron
    environment:
      TZ: ${TZ:-UTC}
      STATIC_CRON_TOKEN: ${STATIC_CRON_TOKEN}
    command:
      - sh
      - -c
      - |
        apk add --no-cache tzdata &&
        (ln -s /usr/share/zoneinfo/$$TZ /etc/localtime || true) &&
        echo "0 3 * * * wget -qO- http://firefly:8080/api/v1/cron/$$STATIC_CRON_TOKEN; echo" | crontab - &&
        crond -f -L /dev/stdout
    networks:
      - firefly-backend
    depends_on:
      - firefly


volumes:
  db_data:
  firefly_iii_upload:
  firefly_iii_db:

networks:
  tunnel-shared:
    driver: bridge
  wordpress-backend:
    driver: bridge
  firefly-backend:
    driver: bridge
